apiVersion: apps/v1
kind: Deployment
metadata:
  name: ticket-backend
  namespace: ticket-assitant
  labels:
    app: ticket-backend
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: ticket-assistant
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ticket-backend
  template:
    metadata:
      labels:
        app: ticket-backend
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: ticket-assistant
    spec:
      serviceAccountName: backend-sa
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: backend
          image: backend-image:latest # Overridden by Kustomize/Helm in CI/CD
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 5000
          env:
            - name: PORT
              value: "5000"
            - name: NODE_ENV
              value: "production"
            - name: CORS_ORIGIN
              value: "https://thama.dpdns.org,http://localhost:5173"
          envFrom:
            - secretRef:
                name: ticket-backend-secrets
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1024Mi"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
