apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ticket-backend
  namespace: ticket-assitant
  labels:
    app: ticket-backend
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  rules:
    - host: api.thama.dpdns.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ticket-backend
                port:
                  number: 80
  tls:
    - hosts:
        - api.thama.dpdns.org
      secretName: ticket-backend-tls
