name: Backend CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'backend/**'
      - '.github/workflows/**'
  pull_request:
    branches:
      - main
      - master
    paths:
      - 'backend/**'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/ticket-backend
  NAMESPACE: ticket-assitant
  APP_HOST: api.thama.dpdns.org

jobs:
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        working-directory: backend
        run: npm ci

      - name: Run Test Suite
        working-directory: backend
        run: npm test

  build-and-push:
    name: Build & Push Docker Image
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and Push Container Image
        uses: docker/build-push-action@v5
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-k8s:
    name: Deploy to Kubernetes Cluster via kubectl
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    environment: Production
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'

      - name: Configure Kubeconfig
        run: |
          mkdir -p $HOME/.kube
          RAW_KUBECONFIG="${{ secrets.KUBE_CONFIG || secrets.KUBECONFIG }}"
          if echo "$RAW_KUBECONFIG" | base64 -d 2>/dev/null | grep -q "apiVersion:"; then
            echo "$RAW_KUBECONFIG" | base64 -d > $HOME/.kube/config
          else
            echo "$RAW_KUBECONFIG" > $HOME/.kube/config
          fi
          chmod 600 $HOME/.kube/config

      - name: Verify Cluster Connection
        run: |
          kubectl cluster-info

      - name: Ensure Target Namespace Exists
        run: |
          kubectl apply -f backend/k8s/namespace.yaml

      - name: Create or Refresh Image Pull Secret
        run: |
          kubectl create secret docker-registry ghcr-secret \
            --namespace=${{ env.NAMESPACE }} \
            --docker-server=${{ env.REGISTRY }} \
            --docker-username=${{ github.actor }} \
            --docker-password=${{ secrets.GITHUB_TOKEN }} \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Create or Update Backend Secrets from .env.prod
        run: |
          if [ -f backend/.env.prod ]; then
            echo "Applying secrets directly from backend/.env.prod..."
            kubectl create secret generic ticket-backend-secrets \
              --namespace=${{ env.NAMESPACE }} \
              --from-env-file=backend/.env.prod \
              --dry-run=client -o yaml | kubectl apply -f -
          else
            echo "backend/.env.prod not present; creating secret from GitHub environment secrets..."
            kubectl create secret generic ticket-backend-secrets \
              --namespace=${{ env.NAMESPACE }} \
              --from-literal=QDRANT_API_KEY="${{ secrets.QDRANT_API_KEY }}" \
              --from-literal=OPENROUTER_API_KEY="${{ secrets.OPENROUTER_API_KEY }}" \
              --from-literal=JWT_SECRET="${{ secrets.JWT_SECRET || 'it-ticket-default-secret-key-change-in-prod' }}" \
              --dry-run=client -o yaml | kubectl apply -f -
          fi

      - name: Deploy Manifests via kubectl & Kustomize
        run: |
          IMAGE_LOWER=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          TAG=${{ github.sha }}
          TAG_SHORT=${TAG:0:7}

          echo "Deploying image: ${IMAGE_LOWER}:${TAG_SHORT} to namespace ${{ env.NAMESPACE }}..."

          # Render kustomize and inject built image tag, then apply with kubectl
          kubectl kustomize backend/k8s | sed "s|backend-image:latest|${IMAGE_LOWER}:${TAG_SHORT}|g" | kubectl apply -f -

      - name: Verify Rollout Status
        run: |
          kubectl rollout status deployment/ticket-backend -n ${{ env.NAMESPACE }} --timeout=180s

      - name: Verify Resources
        run: |
          echo "=== PODS ==="
          kubectl get pods -n ${{ env.NAMESPACE }} -l app=ticket-backend
          echo "=== SERVICE ==="
          kubectl get svc -n ${{ env.NAMESPACE }} ticket-backend
          echo "=== INGRESS (Traefik) ==="
          kubectl get ingress -n ${{ env.NAMESPACE }}
          echo "=== NETWORK POLICIES ==="
          kubectl get networkpolicy -n ${{ env.NAMESPACE }}
