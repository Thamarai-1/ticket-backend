name: Backend CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  NAMESPACE: ticket-assitant
  APP_HOST: api.thama.dpdns.org

jobs:
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Install Dependencies
        run: npm ci

      - name: Run Test Suite
        run: npm test

  build-and-push:
    name: Build & Push Docker Image
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and Push Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-k8s:
    name: Deploy to Kubernetes Cluster via kubectl
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    environment: Production
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'

      - name: Configure Kubeconfig
        run: |
          mkdir -p $HOME/.kube
          RAW_KUBECONFIG="${{ secrets.KUBE_CONFIG || secrets.KUBECONFIG }}"
          if echo "$RAW_KUBECONFIG" | base64 -d 2>/dev/null | grep -q "apiVersion:"; then
            echo "$RAW_KUBECONFIG" | base64 -d > $HOME/.kube/config
          else
            echo "$RAW_KUBECONFIG" > $HOME/.kube/config
          fi
          chmod 600 $HOME/.kube/config

      - name: Verify Cluster Connection
        run: |
          kubectl cluster-info

      - name: Ensure Target Namespace Exists
        run: |
          kubectl apply -f k8s/namespace.yaml

      - name: Create or Refresh Image Pull Secret
        run: |
          kubectl create secret docker-registry ghcr-secret \
            --namespace=${{ env.NAMESPACE }} \
            --docker-server=${{ env.REGISTRY }} \
            --docker-username=${{ github.actor }} \
            --docker-password=${{ secrets.GITHUB_TOKEN }} \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Create or Update Backend Secrets
        run: |
          if [ -f .env.prod ]; then
            echo "Applying secrets directly from .env.prod..."
            kubectl create secret generic ticket-backend-secrets \
              --namespace=${{ env.NAMESPACE }} \
              --from-env-file=.env.prod \
              --dry-run=client -o yaml | kubectl apply -f -
          else
            echo "Creating secrets from production defaults and GitHub environment secrets..."
            kubectl create secret generic ticket-backend-secrets \
              --namespace=${{ env.NAMESPACE }} \
              --from-literal=PORT="5000" \
              --from-literal=NODE_ENV="production" \
              --from-literal=CORS_ORIGIN="https://thama.dpdns.org,http://localhost:5173" \
              --from-literal=JWT_SECRET="${{ secrets.JWT_SECRET || 'super-secret-jwt-key-for-it-ticket-analysis' }}" \
              --from-literal=JWT_EXPIRES_IN="24h" \
              --from-literal=MONGODB_URI="${{ secrets.MONGODB_URI || 'mongodb://admin:MongoTicketSecurePassword2026!@mongodb.ticket-assitant.svc.cluster.local:27017/it_ticket_db?authSource=admin' }}" \
              --from-literal=DATABASE_URL="${{ secrets.DATABASE_URL || 'mongodb://admin:MongoTicketSecurePassword2026!@mongodb.ticket-assitant.svc.cluster.local:27017/it_ticket_db?authSource=admin' }}" \
              --from-literal=MONGODB_DB_NAME="it_ticket_db" \
              --from-literal=MONGO_INITDB_ROOT_USERNAME="admin" \
              --from-literal=MONGO_INITDB_ROOT_PASSWORD="${{ secrets.MONGO_INITDB_ROOT_PASSWORD || 'MongoTicketSecurePassword2026!' }}" \
              --from-literal=MONGO_INITDB_DATABASE="it_ticket_db" \
              --from-literal=ML_SERVICE_URL="http://ml-service.ticket-assitant.svc.cluster.local:8000" \
              --from-literal=ML_SERVICE_TIMEOUT_MS="3000" \
              --from-literal=OPENROUTER_API_KEY="${{ secrets.OPENROUTER_API_KEY }}" \
              --from-literal=OPENROUTER_MODEL="openai/gpt-4o-mini" \
              --from-literal=OPENROUTER_BASE_URL="https://openrouter.ai/api/v1" \
              --from-literal=AI_PROVIDER="openrouter" \
              --from-literal=QDRANT_URL="https://f515a31d-7858-4f82-80f0-ac7bf4e2457b.eu-west-2-0.aws.cloud.qdrant.io" \
              --from-literal=QDRANT_API_KEY="${{ secrets.QDRANT_API_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJhY2Nlc3MiOiJtIiwic3ViamVjdCI6ImFwaS1rZXk6Zjc5N2Q0NTctMTQ5OC00YmE2LWEwMWYtMzA2YjRiZTVlY2JjIn0.VjfMjmFDf8BiO1F_SUYTP-WJK0K5GyHbzR2qd-_1eVw' }}" \
              --from-literal=QDRANT_COLLECTION_NAME="ticket_embeddings" \
              --dry-run=client -o yaml | kubectl apply -f -
          fi

      - name: Deploy Manifests via kubectl & Kustomize
        run: |
          IMAGE_LOWER=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          TAG=${{ github.sha }}
          TAG_SHORT=${TAG:0:7}

          echo "Deploying image: ${IMAGE_LOWER}:${TAG_SHORT} to namespace ${{ env.NAMESPACE }}..."

          # Render kustomize and inject built image tag, then apply with kubectl
          kubectl kustomize k8s | sed "s|backend-image:latest|${IMAGE_LOWER}:${TAG_SHORT}|g" | kubectl apply -f -

      - name: Wait for MongoDB StatefulSet
        run: |
          kubectl rollout status statefulset/mongodb -n ${{ env.NAMESPACE }} --timeout=120s || true

      - name: Verify Backend Rollout Status
        run: |
          kubectl rollout status deployment/ticket-backend -n ${{ env.NAMESPACE }} --timeout=180s

      - name: Debug Diagnostics on Failure
        if: failure()
        run: |
          echo "=== PODS IN NAMESPACE ==="
          kubectl get pods -n ${{ env.NAMESPACE }} -o wide
          echo "=== DESCRIBE BACKEND PODS ==="
          kubectl describe pods -n ${{ env.NAMESPACE }} -l app=ticket-backend
          echo "=== BACKEND LOGS ==="
          kubectl logs -n ${{ env.NAMESPACE }} -l app=ticket-backend --tail=100 --all-containers=true || true
          echo "=== MONGODB LOGS ==="
          kubectl logs -n ${{ env.NAMESPACE }} -l app=mongodb --tail=50 || true

      - name: Verify Resources
        run: |
          echo "=== PODS ==="
          kubectl get pods -n ${{ env.NAMESPACE }} -l app=ticket-backend
          echo "=== SERVICE ==="
          kubectl get svc -n ${{ env.NAMESPACE }} ticket-backend
          echo "=== INGRESS (Traefik) ==="
          kubectl get ingress -n ${{ env.NAMESPACE }}
          echo "=== NETWORK POLICIES ==="
          kubectl get networkpolicy -n ${{ env.NAMESPACE }}
